name: Publish PNULUL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Notify search engines when the custom domain is live
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const host = 'urbanscape.kr';
          const site = 'https://' + host + '/';
          const keyLocation = site + 'indexnow.txt';
          const key = readFileSync('indexnow.txt', 'utf8').trim();
          const proof = await fetch(keyLocation, {redirect: 'error', signal: AbortSignal.timeout(10000)}).catch(() => null);
          if (!proof?.ok || (await proof.text()).trim() !== key) {
            console.log('Waiting for the custom domain and its HTTPS certificate. Rerun this workflow once HTTPS is live.');
            process.exit(0);
          }
          const reply = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: {'Content-Type': 'application/json; charset=utf-8'},
            body: JSON.stringify({host, key, keyLocation, urlList: [site, site + 'people/jisoo-sim/']}),
            signal: AbortSignal.timeout(15000)
          });
          console.log('IndexNow response:', reply.status);
          if (![200, 202].includes(reply.status)) process.exitCode = 1;
          JS
